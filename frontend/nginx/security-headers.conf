# Security headers for the pages and static assets served by nginx.
# Included in each location on purpose: nginx drops inherited add_header
# directives as soon as a location defines its own. The /api/ location does not
# include this file, because the API already sends its own helmet headers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
